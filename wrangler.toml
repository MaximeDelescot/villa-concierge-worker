name = "villa-concierge"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "villa_concierge_db"
database_id = "151e550a-f578-4b56-a3b7-0756320f2c9f"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "villa-concierge-photos"

[[routes]]
pattern = "villa-concierge.com"
custom_domain = true

[[routes]]
pattern = "www.villa-concierge.com"
custom_domain = true
