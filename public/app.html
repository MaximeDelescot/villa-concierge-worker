<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Concierge</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F6F4EF; --surface:#FFFFFF; --surface-2:#EDEAE2; --border:#E1DDD1;
    --ink:#1B211C; --ink-dim:#5C6259; --ink-faint:#8B9186;
    --accent:#1F6F5C; --accent-ink:#0F3B30; --accent-soft:#E4EFE9; --accent-contrast:#FFFFFF;
    --gold:#B4842A;
    --cat-indigo:#4A4F8C; --cat-sage:#66762E; --cat-sky:#2C7A96; --cat-plum:#85486F;
    --warn:#B5561F; --warn-soft:#F6E4D6;
    --good:#1F6F5C; --good-soft:#E4EFE9;
    --danger:#A33B32; --danger-soft:#F5E1DE;
    --shadow: 0 1px 2px rgba(27,33,28,0.06), 0 6px 20px -8px rgba(27,33,28,0.12);
    --shadow-lg: 0 4px 10px rgba(27,33,28,0.10), 0 18px 40px -14px rgba(27,33,28,0.22);
    --radius: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141A15; --surface:#1B221C; --surface-2:#232B24; --border:#303A31;
      --ink:#EDEEE9; --ink-dim:#A6AEA3; --ink-faint:#727B70;
      --accent:#49B695; --accent-ink:#CFF0E4; --accent-soft:#1E3830; --accent-contrast:#0B1210;
      --gold:#D9A94B;
      --cat-indigo:#9FA4E0; --cat-sage:#A8C06C; --cat-sky:#6FC4DE; --cat-plum:#D298C0;
      --warn:#E38A52; --warn-soft:#3A2A1D;
      --good:#49B695; --good-soft:#1E3830;
      --danger:#E4776C; --danger-soft:#3B2320;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
      --shadow-lg: 0 6px 16px rgba(0,0,0,0.4), 0 24px 48px -16px rgba(0,0,0,0.65);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141A15; --surface:#1B221C; --surface-2:#232B24; --border:#303A31;
    --ink:#EDEEE9; --ink-dim:#A6AEA3; --ink-faint:#727B70;
    --accent:#49B695; --accent-ink:#CFF0E4; --accent-soft:#1E3830; --accent-contrast:#0B1210;
    --gold:#D9A94B;
    --cat-indigo:#9FA4E0; --cat-sage:#A8C06C; --cat-sky:#6FC4DE; --cat-plum:#D298C0;
    --warn:#E38A52; --warn-soft:#3A2A1D;
    --good:#49B695; --good-soft:#1E3830;
    --danger:#E4776C; --danger-soft:#3B2320;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
    --shadow-lg: 0 6px 16px rgba(0,0,0,0.4), 0 24px 48px -16px rgba(0,0,0,0.65);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body.guest-mode{ position:fixed; inset:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
  body{ background:var(--bg); }
  #approot{ font-family:'Inter',system-ui,sans-serif; color:var(--ink); background:var(--bg); min-height:100vh; }
  h1,h2,h3{ font-family:'Fraunces',Georgia,serif; font-weight:600; margin:0; text-wrap:balance; }
  p{ margin:0; }
  input,textarea,button{ font-family:inherit; font-size:14px; color:inherit; }
  .muted{ color:var(--ink-dim); }
  .small{ font-size:12.5px; }
  .center{ text-align:center; }
  .stack{ display:flex; flex-direction:column; gap:12px; }
  .stack.lg{ gap:22px; }
  .row{ display:flex; align-items:center; }
  .row.gap{ gap:10px; }
  .row.end{ justify-content:flex-end; }

  /* top bar */
  .topbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; padding:14px 28px; border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:blur(10px); }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Fraunces',serif; font-weight:600; font-size:18px; cursor:pointer; background:none; border:none; color:var(--ink); }
  .brand-mark{ width:30px; height:30px; border-radius:9px; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .brand-logo{ height:38px; width:auto; display:block; }
  .brand-logo.theme-dark{ display:none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand-logo.theme-light{ display:none; }
    :root:not([data-theme="light"]) .brand-logo.theme-dark{ display:block; }
  }
  :root[data-theme="dark"] .brand-logo.theme-light{ display:none; }
  :root[data-theme="dark"] .brand-logo.theme-dark{ display:block; }
  .topbar-tag{ color:var(--ink-faint); font-size:12.5px; }

  .page{ max-width:960px; margin:0 auto; padding:32px 24px 80px; }
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head-info{ display:flex; align-items:center; gap:14px; }
  .page-head-thumb{ width:56px; height:56px; border-radius:12px; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
  .page-title{ font-size:28px; margin-bottom:6px; }
  .page-sub{ color:var(--ink-dim); font-size:14.5px; }
  .link-back{ background:none; border:none; color:var(--ink-dim); font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; display:inline-flex; align-items:center; gap:6px; }
  .link-back:hover{ color:var(--ink); }
  .link-danger{ background:none; border:none; color:var(--danger); font-size:13px; cursor:pointer; padding:0; }

  /* buttons */
  .btn{ border-radius:10px; padding:10px 16px; font-weight:600; font-size:13.5px; border:1px solid transparent; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:opacity .15s, transform .05s; text-decoration:none; }
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-primary{ background:var(--accent); color:var(--accent-contrast); box-shadow:0 1px 2px rgba(0,0,0,0.08), 0 6px 16px -6px color-mix(in srgb, var(--accent) 55%, transparent); }
  .btn-primary:hover:not(:disabled){ opacity:.92; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border-color:var(--border); }
  .switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 0; }
  .switch-label{ font-size:13.5px; }
  .switch{ position:relative; display:inline-block; width:40px; height:22px; flex:none; cursor:pointer; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch-track{ position:absolute; inset:0; background:var(--border); border-radius:999px; transition:background .15s; }
  .switch-track:before{ content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:transform .15s; }
  .switch input:checked + .switch-track{ background:var(--accent); }
  .switch input:checked + .switch-track:before{ transform:translateX(18px); }
  .btn-ghost:hover:not(:disabled){ background:var(--border); }
  .btn-small{ padding:6px 12px; font-size:12.5px; }
  .icon-btn{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:14px; padding:4px 7px; border-radius:7px; }
  .icon-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .icon-btn.danger{ color:var(--ink-faint); }
  .icon-btn.danger:hover, .icon-btn.danger.armed{ color:var(--danger); background:var(--danger-soft); }
  .topbar-icon-btn{ width:42px; height:42px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; color:var(--ink-dim); cursor:pointer; transition:box-shadow .15s ease, border-color .15s ease, color .15s ease, background .15s ease, transform .05s ease; }
  .topbar-icon-btn:hover{ background:var(--surface); border-color:color-mix(in srgb, var(--accent) 35%, var(--border)); color:var(--ink); box-shadow:var(--shadow); }
  .topbar-icon-btn:active{ transform:translateY(1px); }

  /* cards & grid */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:16px; }
  .villa-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:0; overflow:hidden; box-shadow:var(--shadow); cursor:pointer; display:flex; flex-direction:column; transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease; }
  .villa-card-cover{ position:relative; height:112px; background-size:cover; background-position:center; background-color:var(--surface-2); }
  .villa-card-cover.placeholder{ background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }
  .villa-card-cover-icon{ color:var(--accent); opacity:.55; }
  .villa-card-cover .villa-card-cover-delete{ position:absolute; top:8px; right:8px; background:rgba(10,14,11,0.45); color:#fff; backdrop-filter:blur(2px); }
  .villa-card-cover .villa-card-cover-delete:hover, .villa-card-cover .villa-card-cover-delete.armed{ background:rgba(163,59,50,0.85); color:#fff; }
  .villa-card-body{ padding:18px; display:flex; flex-direction:column; gap:8px; }
  .villa-card:hover{ border-color:var(--accent); box-shadow:var(--shadow-lg); transform:translateY(-2px); }
  .villa-card-title{ font-size:17px; }
  .villa-card-meta{ color:var(--ink-faint); font-size:12.5px; margin-bottom:4px; }

  .empty-state{ text-align:center; padding:56px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty-icon{ color:var(--ink-faint); display:flex; justify-content:center; }
  .loading-block{ display:flex; justify-content:center; padding:60px 0; }
  .spinner{ width:26px; height:26px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .skel{ background:var(--surface-2); border-radius:6px; animation:skel-pulse 1.4s ease-in-out infinite; }
  @keyframes skel-pulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .skel{ animation:none; opacity:.75; } }

  /* form fields */
  .field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .field-label{ font-weight:600; color:var(--ink-dim); font-size:12.5px; }
  .input{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:10px 12px; width:100%; outline:none; }
  .input:focus{ border-color:var(--accent); }
  .textarea{ resize:vertical; min-height:64px; font-family:inherit; }

  /* modal */
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,22,18,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--surface); border-radius:16px; width:100%; max-width:420px; box-shadow:var(--shadow); overflow:hidden; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--border); }
  .modal-body{ padding:18px; }

  /* tabs */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:22px; overflow-x:auto; }
  .tab{ background:none; border:none; padding:10px 14px; font-weight:600; font-size:13.5px; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; display:inline-flex; align-items:center; gap:6px; }
  .tab.active{ color:var(--accent-ink); border-bottom-color:var(--accent); }
  .tab-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px; padding:0 5px; border-radius:20px; background:var(--warn); color:var(--warn-soft); font-size:10.5px; font-weight:700; line-height:1; }
  .villa-card-title-row{ display:flex; align-items:center; gap:8px; }

  /* knowledge base */
  .essentials-card{ border-left:3px solid var(--accent); }
  .cover-preview{ width:100%; max-width:280px; height:140px; object-fit:cover; border-radius:10px; border:1px solid var(--border); display:block; }
  .essentials-head{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; cursor:pointer; text-align:left; padding:0; font:inherit; color:inherit; }
  .essentials-head-left{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .essentials-head svg{ flex-shrink:0; transition:transform .15s ease; color:var(--ink-dim); }
  .essential-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); }
  .essential-row:first-child{ padding-top:0; }
  .essential-row:last-child{ border-bottom:none; padding-bottom:0; }
  .essential-row-body{ min-width:0; }
  .essential-row-label{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px; margin-bottom:2px; color:var(--ink); }
  .essential-row-label svg{ color:var(--ink-dim); flex-shrink:0; }
  .essential-row-hint{ color:var(--ink-dim); font-size:12.5px; line-height:1.45; margin:0; }
  .essential-row-actions{ display:flex; align-items:center; gap:12px; flex-shrink:0; padding-top:1px; }
  .link-muted{ background:none; border:none; color:var(--ink-faint); font-size:12.5px; cursor:pointer; padding:0; white-space:nowrap; }
  .link-muted:hover{ color:var(--ink-dim); }
  .gaps-card{ border-left:3px solid var(--warn); }
  .gap-row{ display:flex; flex-direction:column; gap:6px; padding:10px 0; border-bottom:1px solid var(--border); }
  .gap-row:first-child{ padding-top:0; }
  .gap-row:last-child{ border-bottom:none; padding-bottom:0; }
  .gap-row-head{ display:flex; align-items:center; gap:10px; }
  .gap-row-label{ font-weight:600; font-size:13.5px; flex:1; display:flex; align-items:center; gap:6px; }
  .gap-row-label svg{ color:var(--ink-dim); flex-shrink:0; }
  .gap-row-count{ font-size:11.5px; font-weight:700; color:var(--warn); background:var(--warn-soft); padding:2px 9px; border-radius:20px; white-space:nowrap; }
  .gap-examples{ margin:0; padding-left:18px; color:var(--ink-dim); font-size:12.5px; line-height:1.5; }
  .gap-examples li{ margin-bottom:2px; }
  .kb-progress{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-dim); }
  .kb-progress-head{ display:flex; align-items:baseline; justify-content:space-between; }
  .kb-progress-label{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .kb-progress-pct{ font-family:'Fraunces',serif; font-size:17px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .kb-group{ display:flex; flex-direction:column; gap:10px; }
  .kb-group-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); margin:0 2px; }
  .progress-bar{ height:6px; background:var(--surface-2); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .cat-section{ border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
  .cat-header{ width:100%; display:flex; align-items:center; gap:10px; padding:13px 16px; background:none; border:none; cursor:pointer; text-align:left; transition:background .15s ease; }
  .cat-header:hover{ background:var(--surface-2); }
  .cat-icon{ display:flex; align-items:center; color:var(--ink-dim); flex-shrink:0; }
  .cat-label{ font-weight:600; flex:1; font-size:14px; }
  .cat-count{ background:var(--surface-2); color:var(--ink-dim); font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:20px; }
  .cat-count.empty{ background:transparent; color:var(--ink-faint); }
  .cat-chevron{ color:var(--ink-faint); font-size:12px; }
  .cat-body{ padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--border); padding-top:12px; }
  .kb-item{ display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border-radius:10px; padding:10px 12px; }
  .kb-item-photo-wrap{ position:relative; flex-shrink:0; }
  .kb-item-photo{ width:44px; height:44px; object-fit:cover; border-radius:8px; flex-shrink:0; display:block; }
  .kb-item-photo-count{ position:absolute; bottom:-4px; right:-4px; background:var(--accent); color:var(--accent-contrast); font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:8px; line-height:1.4; box-shadow:var(--shadow); }
  .kb-item-body{ flex:1; min-width:0; }
  .kb-item-title{ font-weight:600; font-size:13.5px; }
  .kb-item-content{ color:var(--ink-dim); font-size:13px; margin-top:2px; white-space:pre-wrap; }
  .kb-item-actions{ display:flex; gap:2px; flex-shrink:0; }
  .kb-form{ display:flex; flex-direction:column; gap:12px; background:var(--surface-2); padding:14px; border-radius:10px; }
  .kb-photo-preview{ width:52px; height:52px; object-fit:cover; border-radius:8px; flex-shrink:0; }
  .kb-photos-editor{ display:flex; flex-direction:column; gap:8px; }
  .kb-photo-edit-row{ display:flex; align-items:center; gap:8px; }
  .kb-photo-edit-row .input{ flex:1; min-width:0; }
  .kb-photos-hint{ color:var(--ink-faint); font-size:12px; }
  .error-text{ color:var(--danger); font-size:12.5px; }
  .error-text.center{ text-align:center; }

  /* qr panel */
  .qr-panel{ display:grid; grid-template-columns:220px 1fr; gap:26px; align-items:start; }
  @media (max-width:640px){ .qr-panel{ grid-template-columns:1fr; } }
  .qr-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center; box-shadow:var(--shadow); }
  .qr-image{ width:100%; max-width:180px; image-rendering:pixelated; }
  .qr-fallback{ color:var(--ink-faint); display:flex; justify-content:center; padding:40px 0; }
  .qr-caption{ margin-top:12px; font-family:'Fraunces',serif; font-size:13px; color:var(--ink-dim); }

  /* stats & conversations */
  .stats-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  @media (max-width:640px){ .stats-row{ grid-template-columns:1fr; } }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow); }
  .stat-value{ font-family:'Fraunces',serif; font-size:26px; font-variant-numeric:tabular-nums; }
  .stat-tile.tone-warn .stat-value{ color:var(--warn); }
  .stat-tile.tone-good .stat-value{ color:var(--good); }
  .stat-label{ color:var(--ink-dim); font-size:12px; margin-top:2px; }
  .admin-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .admin-table th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--border); }
  .admin-table td{ padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle; color:var(--ink); }
  .admin-table tr:last-child td{ border-bottom:none; }
  .admin-badge{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 8px; }
  .block-title{ font-size:14px; margin-bottom:12px; }
  .topic-bars{ display:flex; flex-direction:column; gap:8px; }
  .topic-bar-row{ display:grid; grid-template-columns:150px 1fr 26px; align-items:center; gap:10px; font-size:12.5px; }
  .topic-bar-label{ color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topic-bar-track{ height:8px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .topic-bar-fill{ height:100%; background:var(--gold); border-radius:5px; }
  .topic-bar-count{ text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-dim); }
  .chip{ border:1px solid var(--border); background:var(--surface); border-radius:20px; padding:6px 13px; font-size:12.5px; font-weight:600; color:var(--ink-dim); cursor:pointer; }
  .chip.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .convo-list{ display:flex; flex-direction:column; gap:8px; }
  .convo-row{ border:1px solid var(--border); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); overflow:hidden; }
  .convo-summary{ width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 14px; background:none; border:none; cursor:pointer; text-align:left; transition:background .15s ease; }
  .convo-summary:hover{ background:var(--surface-2); }
  .convo-badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--good-soft); color:var(--good); white-space:nowrap; }
  .convo-badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .convo-snippet{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .convo-time{ font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
  .convo-thread{ padding:4px 14px 16px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:8px; padding-top:12px; }

  .msg-row{ display:flex; gap:7px; align-items:flex-end; max-width:88%; }
  .msg-row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.assistant, .msg-row.manager{ align-self:flex-start; }
  .msg-icon{ width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-bottom:1px; }
  .msg-icon.user{ background:var(--surface-2); color:var(--ink-dim); }
  .msg-icon.assistant, .msg-icon.manager{ background:var(--accent); color:var(--accent-contrast); }
  .msg-icon.assistant.escalated{ background:var(--warn); color:var(--warn-soft); }
  .msg-bubble{ min-width:0; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; box-shadow:var(--shadow); }
  .msg-photos{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .msg-photo-item{ width:130px; max-width:100%; }
  .msg-photo{ display:block; width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; cursor:zoom-in; transition:opacity .15s ease; }
  .msg-photo:hover{ opacity:.85; }
  .msg-photo-caption{ margin-top:4px; font-size:11px; line-height:1.3; color:var(--ink-faint); }

  /* photo lightbox — full-size carousel opened from a chat photo */
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(10,12,9,.9); display:flex; align-items:center; justify-content:center; z-index:80; padding:24px; }
  .lightbox-stage{ display:flex; flex-direction:column; align-items:center; gap:12px; max-width:min(92vw,720px); max-height:88vh; }
  .lightbox-img{ max-width:100%; max-height:72vh; object-fit:contain; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .lightbox-caption{ color:#fff; font-size:13.5px; text-align:center; max-width:60ch; }
  .lightbox-close{ position:absolute; top:18px; right:18px; background:rgba(255,255,255,.12); border:none; color:#fff; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .lightbox-close:hover{ background:rgba(255,255,255,.22); }
  .lightbox-nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.12); border:none; color:#fff; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .lightbox-nav:hover{ background:rgba(255,255,255,.22); }
  .lightbox-prev{ left:18px; }
  .lightbox-next{ right:18px; }
  .lightbox-dots{ display:flex; gap:6px; }
  .lightbox-dot{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); cursor:pointer; }
  .lightbox-dot.active{ background:#fff; }
  @media (max-width:640px){ .lightbox-nav{ width:38px; height:38px; } .lightbox-prev{ left:8px; } .lightbox-next{ right:8px; } }
  .msg-bubble.user{ background:var(--surface-2); color:var(--ink); border-bottom-right-radius:4px; }
  .msg-bubble.assistant, .msg-bubble.manager{ background:var(--accent-soft); color:var(--ink); border-bottom-left-radius:4px; }
  .msg-bubble.assistant.escalated{ background:var(--warn-soft); color:var(--ink); border-bottom-left-radius:4px; }
  .msg-role-label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.06em; margin-bottom:3px; }
  .msg-role-label.user{ color:var(--ink-faint); }
  .msg-role-label.assistant, .msg-role-label.manager{ color:var(--accent); }
  .msg-role-label.assistant.escalated{ color:var(--warn); }
  .convo-thread .msg-row{ max-width:100%; }
  .convo-reply-form{ margin-top:10px; }

  /* guest app */
  .guest-app{ display:flex; flex-direction:column; height:100vh; height:100dvh; background:var(--bg); max-width:560px; margin:0 auto; touch-action:pan-x pan-y; }
  .preview-overlay{ position:fixed; inset:0; background:var(--bg); z-index:60; display:flex; flex-direction:column; }
  .preview-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 14px; background:var(--accent-soft); color:var(--accent-ink); border-bottom:1px solid var(--border); font-size:12px; font-weight:700; flex-shrink:0; box-shadow:var(--shadow); }
  .preview-body{ flex:1; min-height:0; display:flex; }
  .preview-body .guest-app{ height:100%; max-width:none; flex:1; }
  .guest-header{ position:relative; z-index:2; display:flex; align-items:center; gap:12px; padding:16px 18px; background:var(--surface); box-shadow:0 2px 4px rgba(27,33,28,0.05), 0 10px 24px -14px rgba(27,33,28,0.25); }
  .guest-header-emoji{ width:36px; height:36px; border-radius:10px; background:var(--accent); color:var(--accent-contrast); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .guest-header-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16.5px; }
  .guest-header-sub{ font-size:11.5px; color:var(--ink-faint); }
  .guest-messages{ flex:1; overflow-y:auto; overscroll-behavior:contain; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .guest-suggestions{ display:flex; gap:8px; padding:0 18px 10px; flex-wrap:wrap; }
  .guest-input-bar{ position:relative; z-index:2; display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:var(--surface); box-shadow:0 -2px 4px rgba(27,33,28,0.05), 0 -10px 24px -14px rgba(27,33,28,0.25); }
  .guest-input-bar .input{ flex:1; border-radius:22px; padding:11px 16px; font-size:16px; }
  .send-btn{ width:42px; height:42px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); border:none; font-size:16px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,0.08), 0 6px 16px -6px color-mix(in srgb, var(--accent) 55%, transparent); transition:opacity .15s, transform .05s; }
  .send-btn:active{ transform:translateY(1px); }
  .send-btn:disabled{ opacity:.5; }
  .center-msg{ align-items:center; justify-content:center; text-align:center; gap:8px; font-size:15px; }
  .typing{ display:flex; gap:4px; padding:13px; }
  .typing .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); display:inline-block; animation:bounce 1.2s infinite; }
  .typing .dot:nth-child(2){ animation-delay:.15s; }
  .typing .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-4px); opacity:1;} }

  /* login gate */
  .login-wrap{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
    position:relative; overflow:hidden;
    background:
      radial-gradient(640px 480px at 12% -8%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 62%),
      radial-gradient(720px 560px at 108% 112%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 62%),
      var(--bg);
  }
  .login-wrap:before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image: radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 1.6px);
    background-size: 24px 24px;
    opacity:.55;
    mask-image: radial-gradient(circle at 50% 42%, transparent 190px, black 440px);
    -webkit-mask-image: radial-gradient(circle at 50% 42%, transparent 190px, black 440px);
  }
  .login-card{
    position:relative; z-index:1; width:100%; max-width:368px; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; padding:34px 30px 30px; box-shadow:var(--shadow-lg); text-align:center; overflow:hidden;
  }
  .login-card:before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--accent), var(--gold));
  }
  .login-card form{ text-align:left; }
  .login-logo{ height:38px; width:auto; display:block; margin:0 auto 22px; }
  .login-logo.theme-dark{ display:none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .login-logo.theme-light{ display:none; }
    :root:not([data-theme="light"]) .login-logo.theme-dark{ display:block; }
  }
  :root[data-theme="dark"] .login-logo.theme-light{ display:none; }
  :root[data-theme="dark"] .login-logo.theme-dark{ display:block; }
  .login-heading{ font-size:21px; margin-bottom:5px; }
  .login-subtitle{ margin-bottom:22px; }
  .input-icon-field{ position:relative; }
  .input-icon-field .field-icon{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
  .input-icon-field .input{ padding-left:36px; }
  .login-submit{ width:100%; justify-content:center; margin-top:4px; }
  .login-forgot-link{ display:block; width:100%; background:none; border:none; cursor:pointer; padding:0; margin-top:14px; text-align:center; text-decoration:underline; }
  .login-divider{ height:1px; background:var(--border); margin:20px 0 16px; }
  .login-switch-btn{ width:100%; justify-content:center; }
  .login-footer{ margin-top:18px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }

<body>
<div id="approot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef,
      useCallback = React.useCallback, useMemo = React.useMemo;
  var e = React.createElement;

  // ---------------------------------------------------------------------
  // Categories (unchanged from the original design)
  // ---------------------------------------------------------------------
  var CATEGORIES = [
    { id: "general", label: "General information", icon: IconInfo },
    { id: "location", label: "Address & location", icon: IconMapPin },
    { id: "checkinout", label: "Check-in / Check-out", icon: IconKey },
    { id: "wifi", label: "WiFi", icon: IconWifi },
    { id: "rules", label: "Villa rules", icon: IconClipboard },
    { id: "pets", label: "Pets", icon: IconPaw },
    { id: "equipment", label: "Equipment", icon: IconTool },
    { id: "appliances", label: "Appliances", icon: IconBox },
    { id: "ac", label: "Air conditioning", icon: IconWind },
    { id: "entertainment", label: "TV / Entertainment", icon: IconTv },
    { id: "pool", label: "Pool", icon: IconDroplet },
    { id: "services", label: "Available services", icon: IconBell },
    { id: "housekeeping", label: "Housekeeping", icon: IconRefreshCw },
    { id: "recommendations", label: "Local recommendations", icon: IconStar },
    { id: "supermarkets", label: "Supermarkets", icon: IconShoppingCart },
    { id: "attractions", label: "Points of interest", icon: IconCompass },
    { id: "transport", label: "Transport", icon: IconTruck },
    { id: "contacts", label: "Important contacts", icon: IconPhone },
    { id: "emergency", label: "Emergency information", icon: IconAlertTriangle },
    { id: "custom", label: "Custom questions", icon: IconMessageSquare },
    // Promoted from the old dismissible "Essential knowledge" suggestion
    // card to real categories -- guests ask about these at essentially
    // every rental, anywhere, so they belong alongside WiFi or Pool, not
    // behind an optional Add/dismiss flow.
    { id: "hot_water", label: "Hot water", icon: IconThermometer },
    { id: "staff_schedule", label: "On-site staff schedule", icon: IconClock },
    { id: "deposit_policy", label: "Security deposit & payment", icon: IconDollarSign },
    { id: "quiet_hours", label: "Noise & quiet hours", icon: IconMoon },
    // Destination-specific culture and customs (canang sari, Nyepi...) --
    // split out from "general" so it doesn't get buried among unrelated
    // practical notes.
    { id: "cultural", label: "Cultural specifics", icon: IconTemple }
  ];
  var CAT_BY_ID = {};
  CATEGORIES.forEach(function (c) { CAT_BY_ID[c.id] = c; });

  // Display-only grouping of the categories above -- doesn't change their
  // ids, labels, or how the AI classifies anything, just how they're laid
  // out in the Knowledge base tab so related categories read as one
  // section (e.g. a security deposit note sits under "Rules & security"
  // alongside the villa's house rules, even though both are still plain
  // "rules" items underneath).
  var CATEGORY_GROUPS = [
    { label: "Essentials", categories: ["general", "location", "checkinout", "wifi"], color: "var(--accent)" },
    { label: "Villa & amenities", categories: ["equipment", "appliances", "ac", "entertainment", "pool", "hot_water"], color: "var(--gold)" },
    { label: "Rules & security", categories: ["rules", "pets", "emergency", "deposit_policy", "quiet_hours"], color: "var(--cat-indigo)" },
    { label: "Services & housekeeping", categories: ["services", "housekeeping", "staff_schedule"], color: "var(--cat-sage)" },
    { label: "Local area", categories: ["recommendations", "supermarkets", "attractions", "transport", "cultural"], color: "var(--cat-sky)" },
    { label: "Contacts & other", categories: ["contacts", "custom"], color: "var(--cat-plum)" }
  ];
  // One muted accent color per group above, carried onto each category's
  // icon -- a light touch of color to tell sections apart at a glance,
  // without turning the page into a rainbow (still just 6 tones from the
  // existing earthy palette, never the --warn/--danger status colors so
  // nothing accidentally reads as an alert).
  CATEGORY_GROUPS.forEach(function (g) {
    g.categories.forEach(function (id) { if (CAT_BY_ID[id]) CAT_BY_ID[id].color = g.color; });
  });

  var DEFAULT_TEMPLATE = {
    addLabel: "an item",
    fields: [
      { key: "title", label: "Title", type: "text", placeholder: "e.g. Washing machine" },
      { key: "content", label: "Details", type: "textarea", placeholder: "Any details that would be useful for the guest" }
    ],
    title: function (v) { return v.title || ""; },
    content: function (v) { return v.content || ""; }
  };
  var RECOMMENDATION_TYPES = ["Restaurant", "Bar / Rooftop", "Café", "Cultural visit", "Activity / Excursion", "Wellness", "Shopping", "Other"];
  var CATEGORY_TEMPLATES = {
    hot_water: {
      addLabel: "a note about hot water",
      fields: [{ key: "content", label: "Details", type: "textarea", placeholder: "e.g. Switch on the water heater a few minutes before showering for hot water." }],
      title: function () { return "Hot water"; },
      content: function (v) { return v.content || ""; }
    },
    staff_schedule: {
      addLabel: "a note about on-site staff",
      fields: [{ key: "content", label: "Details", type: "textarea", placeholder: "e.g. Housekeeper comes Mon/Wed/Fri 9am–1pm. Contact via WhatsApp at +62..." }],
      title: function () { return "On-site staff schedule"; },
      content: function (v) { return v.content || ""; }
    },
    deposit_policy: {
      addLabel: "a note about the deposit",
      fields: [{ key: "content", label: "Details", type: "textarea", placeholder: "e.g. $200 cash on arrival, refunded within 48h after check-out." }],
      title: function () { return "Security deposit & payment"; },
      content: function (v) { return v.content || ""; }
    },
    quiet_hours: {
      addLabel: "a note about quiet hours",
      fields: [{ key: "content", label: "Details", type: "textarea", placeholder: "e.g. Please keep noise down after 10pm out of respect for neighbors." }],
      title: function () { return "Noise & quiet hours"; },
      content: function (v) { return v.content || ""; }
    },
    recommendations: {
      addLabel: "a recommendation",
      fields: [
        { key: "title", label: "Place name", type: "text", placeholder: "e.g. La Brisa" },
        { key: "type", label: "Type", type: "select", options: RECOMMENDATION_TYPES },
        { key: "description", label: "Description", type: "textarea", placeholder: "Why recommend it, atmosphere, specialties, distance..." },
        { key: "link", label: "Link (Google Maps, TripAdvisor... — optional)", type: "text", placeholder: "https://maps.google.com/..." }
      ],
      title: function (v) { return (v.title || "Recommendation") + (v.type ? " · " + v.type : ""); },
      content: function (v) {
        var parts = [];
        if (v.description) parts.push(v.description);
        if (v.link) parts.push("More info: " + v.link);
        return parts.join(" ");
      }
    },
    wifi: {
      addLabel: "a WiFi network",
      fields: [
        { key: "ssid", label: "Network name (SSID)", type: "text", placeholder: "e.g. Villa_WiFi" },
        { key: "password", label: "Password", type: "text", placeholder: "e.g. Sunset88" }
      ],
      title: function (v) { return "WiFi network" + (v.ssid ? " — " + v.ssid : ""); },
      content: function (v) {
        var parts = [];
        if (v.ssid) parts.push("Network name: " + v.ssid);
        if (v.password) parts.push("Password: " + v.password);
        return parts.join(". ");
      }
    },
    checkinout: {
      addLabel: "a schedule",
      fields: [
        { key: "checkIn", label: "Check-in time", type: "text", placeholder: "e.g. 14:00" },
        { key: "checkOut", label: "Check-out time", type: "text", placeholder: "e.g. 11:00" },
        { key: "lateCheckout", label: "Late check-out policy (optional)", type: "textarea", placeholder: "e.g. Available subject to availability, 200,000 IDR surcharge. Leave blank if not applicable." }
      ],
      title: function () { return "Check-in / Check-out"; },
      content: function (v) {
        var parts = [];
        if (v.checkIn) parts.push("Check-in at " + v.checkIn);
        if (v.checkOut) parts.push("Check-out at " + v.checkOut);
        if (v.lateCheckout) parts.push("Late check-out: " + v.lateCheckout);
        return parts.join(". ");
      }
    },
    contacts: {
      addLabel: "a contact",
      fields: [
        { key: "name", label: "Name", type: "text", placeholder: "e.g. Made" },
        { key: "role", label: "Role (optional)", type: "text", placeholder: "e.g. Manager, housekeeping..." },
        { key: "phone", label: "Phone / WhatsApp", type: "text", placeholder: "e.g. +62 812-3456-7890" },
        { key: "notes", label: "Notes (optional)", type: "textarea", placeholder: "Availability hours, languages spoken..." }
      ],
      title: function (v) { return v.name || "Contact"; },
      content: function (v) {
        var parts = [];
        if (v.role) parts.push(v.role);
        if (v.phone) parts.push("reachable at " + v.phone);
        if (v.notes) parts.push(v.notes);
        return parts.join(" — ");
      }
    },
    emergency: {
      addLabel: "an emergency contact",
      fields: [
        { key: "name", label: "Service / contact", type: "text", placeholder: "e.g. BIMC Kuta Clinic" },
        { key: "phone", label: "Phone", type: "text", placeholder: "e.g. +62 361 761263" },
        { key: "notes", label: "Notes (optional)", type: "textarea", placeholder: "Distance, hours, when to call..." }
      ],
      title: function (v) { return v.name || "Emergency"; },
      content: function (v) {
        var parts = [];
        if (v.phone) parts.push("Phone: " + v.phone);
        if (v.notes) parts.push(v.notes);
        return parts.join(". ");
      }
    },
    custom: {
      addLabel: "a question",
      fields: [
        { key: "question", label: "Guest's question", type: "text", placeholder: "e.g. Can we bring a pet?" },
        { key: "answer", label: "Answer", type: "textarea", placeholder: "Answer to give the guest" }
      ],
      title: function (v) { return v.question || ""; },
      content: function (v) { return v.answer || ""; }
    }
  };
  function templateForCategory(catId) { return CATEGORY_TEMPLATES[catId] || DEFAULT_TEMPLATE; }
  function initialValuesFor(tmpl, initial) {
    var v = {};
    tmpl.fields.forEach(function (f) { v[f.key] = ""; });
    if (initial && initial.fields) {
      tmpl.fields.forEach(function (f) { if (initial.fields[f.key] != null) v[f.key] = initial.fields[f.key]; });
    } else if (initial) {
      if (tmpl.fields[0]) v[tmpl.fields[0].key] = initial.title || "";
      var textField = null;
      tmpl.fields.forEach(function (f) { if (f.type === "textarea") textField = f; });
      if (!textField && tmpl.fields.length > 1) textField = tmpl.fields[1];
      if (textField) v[textField.key] = initial.content || "";
    }
    return v;
  }
  function materializeFields(catId, fields) {
    var tmpl = templateForCategory(catId);
    var title = (tmpl.title(fields) || "").trim() || "(untitled)";
    var content = (tmpl.content(fields) || "").trim();
    return { title: title, content: content, fields: fields };
  }

  // ---------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------
  function formatDate(iso) {
    try { return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
    catch (err) { return ""; }
  }
  function formatTime(iso) {
    try { return new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }); }
    catch (err) { return ""; }
  }
  function buildGuestUrl(villaId) {
    return location.origin + location.pathname + location.search + "#screen=guest&villa=" + encodeURIComponent(villaId);
  }
  function nowIso() { return new Date().toISOString(); }

  function compressImage(file, maxW, quality) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, maxW / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(function (blob) {
            if (blob) resolve(blob); else reject(new Error("toBlob failed"));
          }, "image/jpeg", quality);
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function computeKnowledgeGaps(convos) {
    var gaps = {};
    (convos || []).forEach(function (c) {
      var msgs = c.messages || [];
      msgs.forEach(function (m, idx) {
        if (m.role !== "assistant" || m.answered !== false) return;
        var t = m.topic || "other";
        if (!gaps[t]) gaps[t] = { topic: t, count: 0, examples: [] };
        gaps[t].count++;
        var prevUser = null;

  }
